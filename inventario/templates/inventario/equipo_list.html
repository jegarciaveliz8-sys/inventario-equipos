<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Equipos</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        table { width: 100%; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-collapse: collapse; }
        th { background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f8f9fa; }
        a { color: #667eea; text-decoration: none; }
        .estado { padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
        .disponible { background: #d1fae5; color: #065f46; }
        .asignado { background: #dbeafe; color: #1e40af; }
        .en_reparacion { background: #fef3c7; color: #92400e; }
        .dado_de_baja { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Equipos Registrados</h1>
        <p><a href="{% url 'inventario:dashboard' %}">← Volver al Dashboard</a></p>
        <table>
            <tr><th>Nombre</th><th>Marca</th><th>Modelo</th><th>Serial</th><th>Estado</th></tr>
            {% for e in equipos %}
            <tr>
                <td><a href="{% url 'inventario:equipo_detail' e.id %}">{{ e.nombre }}</a></td>
                <td>{{ e.marca }}</td>
                <td>{{ e.modelo }}</td>
                <td>{{ e.serial }}</td>
                <td><span class="estado {{ e.estado }}">{{ e.get_estado_display }}</span></td>
            </tr>
            {% empty %}
            <tr><td colspan="5" style="text-align:center;">No hay equipos registrados</td></tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
