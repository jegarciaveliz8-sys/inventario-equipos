<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario de Equipos</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #1a1a2e; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 20px 0; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        .card h3 { margin: 0; color: #764ba2; font-size: 2rem; }
        .card p { margin: 5px 0 0; color: #666; }
        .nav { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .nav a { color: #667eea; text-decoration: none; margin-right: 15px; font-weight: 600; }
        .nav a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Inventario de Equipos</h1>
        <div class="nav">
            <a href="{% url 'inventario:equipo_list' %}">Equipos</a>
            <a href="{% url 'inventario:asignacion_list' %}">Asignaciones</a>
            <a href="{% url 'inventario:asignacion_nueva' %}">Nueva Asignacion</a>
            <a href="/admin/">Panel Admin</a>
        </div>
        <div class="cards">
            <div class="card"><h3>{{ total_equipos }}</h3><p>Total Equipos</p></div>
            <div class="card"><h3>{{ equipos_asignados }}</h3><p>Asignados</p></div>
            <div class="card"><h3>{{ total_clientes }}</h3><p>Clientes</p></div>
            <div class="card"><h3>{{ asignaciones_activas }}</h3><p>Asignaciones Activas</p></div>
            <div class="card"><h3>{{ hojas_pendientes }}</h3><p>Hojas Pendientes de Firma</p></div>
        </div>
    </div>
</body>
</html>
