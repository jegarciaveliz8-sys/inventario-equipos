<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📸 Subir Evidencia</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px 25px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        .camera-btn {
            width: 100%;
            padding: 50px 20px;
            border: 3px dashed #667eea;
            border-radius: 16px;
            background: #f8f9ff;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }
        .camera-btn:active {
            transform: scale(0.98);
            background: #eef0ff;
        }
        .camera-btn .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .camera-btn .text {
            color: #667eea;
            font-weight: 600;
            font-size: 16px;
        }
        .camera-btn .hint {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }
        #preview {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
            display: none;
            border: 2px solid #667eea;
        }
        .preview-label {
            display: none;
            text-align: center;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        .btn-submit:active {
            transform: translateY(2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            display: none;
            font-weight: 600;
        }
        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .result img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
        .scan-qr {
            text-align: center;
            margin-bottom: 20px;
        }
        .scan-qr a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>📸 Evidencia</h1>
    <p class="subtitle">Toma una foto o selecciona una imagen</p>
    
    <div class="scan-qr">
        <a href="/escanear-qr/">🔗 Escanear QR del equipo primero →</a>
    </div>

    <form id="formEvidencia">
        <div class="form-group">
            <label for="equipoId">ID o Serial del Equipo</label>
            <input type="text" id="equipoId" name="equipoId" placeholder="Ej: TEST001 o MONITOR002" required>
        </div>

        <div class="form-group">
            <label for="tipo">Tipo de evidencia</label>
            <select id="tipo" name="tipo">
                <option value="general">General</option>
                <option value="asignacion">Entrega / Asignacion</option>
                <option value="devolucion">Devolucion</option>
                <option value="reparacion">Reparacion</option>
            </select>
        </div>

        <div class="form-group">
            <label for="descripcion">Descripcion (opcional)</label>
            <input type="text" id="descripcion" name="descripcion" placeholder="Ej: Estado del equipo al entregar">
        </div>

        <!-- Input de archivo oculto -->
        <input type="file" id="fotoInput" name="foto" accept="image/*" capture="environment">
        
        <!-- Boton grande para camara -->
        <div class="camera-btn" onclick="document.getElementById('fotoInput').click()">
            <div class="icon">📷</div>
            <div class="text">Tocar para abrir camara</div>
            <div class="hint">Tambien puedes elegir de la galeria</div>
        </div>

        <p class="preview-label" id="previewLabel">✅ Foto seleccionada</p>
        <img id="preview" alt="Vista previa">

        <button type="submit" class="btn-submit" id="btnSubmit">
            <span id="btnText">📤 Subir Evidencia</span>
            <div class="spinner" id="spinner"></div>
        </button>
    </form>

    <div class="result" id="result"></div>
</div>

<script>
    const fotoInput = document.getElementById('fotoInput');
    const preview = document.getElementById('preview');
    const previewLabel = document.getElementById('previewLabel');
    const form = document.getElementById('formEvidencia');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    const result = document.getElementById('result');

    // Mostrar preview cuando seleccionan foto
    fotoInput.addEventListener('change', function() {
        if (this.files && this.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
                previewLabel.style.display = 'block';
            };
            reader.readAsDataURL(this.files[0]);
        }
    });

    // Manejar envio del formulario
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const foto = fotoInput.files[0];
        if (!foto) {
            showResult('❌ Debes seleccionar una foto primero', false);
            return;
        }

        // Deshabilitar boton y mostrar spinner
        btnSubmit.disabled = true;
        btnText.style.display = 'none';
        spinner.style.display = 'block';
        result.style.display = 'none';

        const formData = new FormData();
        formData.append('foto', foto);
        formData.append('equipoId', document.getElementById('equipoId').value);
        formData.append('tipo', document.getElementById('tipo').value);
        formData.append('descripcion', document.getElementById('descripcion').value);

        try {
            const response = await fetch('/api/evidencias/subir/', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': getCookie('csrftoken')
                }
            });

            const data = await response.json();

            if (response.ok && data.success) {
                showResult(
                    `✅ Evidencia subida correctamente!<br><br>` +
                    `<strong>Equipo:</strong> ${data.equipo}<br>` +
                    `<a href="${data.url}" target="_blank">Ver foto en Cloudinary</a>`,
                    true
                );
                preview.src = data.url;
                // Limpiar formulario despues de 3 segundos
                setTimeout(() => {
                    form.reset();
                    preview.style.display = 'none';
                    previewLabel.style.display = 'none';
                    result.style.display = 'none';
                }, 4000);
            } else {
                showResult(`❌ Error: ${data.error || 'No se pudo subir'}`, false);
            }
        } catch (err) {
            showResult(`❌ Error de red: ${err.message}`, false);
        } finally {
            btnSubmit.disabled = false;
            btnText.style.display = 'block';
            spinner.style.display = 'none';
        }
    });

    function showResult(message, isSuccess) {
        result.innerHTML = message;
        result.className = 'result ' + (isSuccess ? 'success' : 'error');
        result.style.display = 'block';
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
</script>

</body>
</html>
