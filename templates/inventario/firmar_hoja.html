{% extends "base.html" %}
{% block content %}
<div class="container py-4" style="max-width: 700px;">
  <h2>✍️ Firmar Hoja de Responsabilidad</h2>
  <div class="card mb-4">
    <div class="card-body">
      <h5>{{ hoja.asignacion.equipo }}</h5>
      <p><strong>Cliente:</strong> {{ hoja.asignacion.cliente }}<br>
      <strong>Serial:</strong> {{ hoja.asignacion.equipo.serial }}</p>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <h5>Dibuja tu firma:</h5>
      <canvas id="firmaCanvas" width="600" height="200" style="border: 2px solid #333; border-radius: 8px; background: #fff; cursor: crosshair; width: 100%;"></canvas>
      <div class="mt-3">
        <button class="btn btn-secondary" onclick="limpiar()">Limpiar</button>
        <button class="btn btn-success" onclick="guardar()">Guardar Firma</button>
        <a href="{% url 'generar_pdf_hoja' hoja.pk %}" class="btn btn-primary" target="_blank">Ver PDF</a>
      </div>
      <p id="mensaje" class="mt-2"></p>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('firmaCanvas');
const ctx = canvas.getContext('2d');
let dibujando = false;

// Ajustar tamaño real del canvas
function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = 200;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

canvas.addEventListener('mousedown', e => {
    dibujando = true;
    const rect = canvas.getBoundingClientRect();
    ctx.beginPath();
    ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
});
canvas.addEventListener('mousemove', e => {
    if (!dibujando) return;
    const rect = canvas.getBoundingClientRect();
    ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
    ctx.stroke();
});
canvas.addEventListener('mouseup', () => dibujando = false);
canvas.addEventListener('mouseleave', () => dibujando = false);

// Touch support
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    dibujando = true;
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    ctx.beginPath();
    ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
});
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!dibujando) return;
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
    ctx.stroke();
});
canvas.addEventListener('touchend', () => dibujando = false);

function limpiar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function guardar() {
    const dataURL = canvas.toDataURL('image/png');
    fetch('/hojas/{{ hoja.pk }}/firmar/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify({firma: dataURL})
    })
    .then(r => r.json())
    .then(data => {
        if (data.ok) {
            document.getElementById('mensaje').innerHTML = '<span class="text-success">✅ Firma guardada correctamente.</span>';
        } else {
            document.getElementById('mensaje').innerHTML = '<span class="text-danger">❌ Error: ' + (data.error || 'desconocido') + '</span>';
        }
    });
}
</script>
{% endblock %}
